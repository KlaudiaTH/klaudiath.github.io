baseURL = "https://klaudiath.github.io/"
languageCode = "en-us"
title = "Klaudia-Doris Thellmann"

theme = "PaperMod"

enableRobotsTXT = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = "production"
  defaultTheme = "auto"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = false

  # Optional: Label links oben (statt Titel)
  [params.label]
    text = "Klaudia-Doris Thellmann"

[params.homeInfoParams]
  Title = "Hello 👋"
  Content = """
<div class="home-top">
<div class="home-grid">
<div class="home-left">

<p class="home-bio">
I am a Machine Learning Engineer / NLP researcher at TU Dresden, working on multilingual LLM evaluation and scalable benchmarking pipelines.
My background is in computer science (university degree) with a background in data management (Big Data architectures & analytics), now focusing on NLP and large language models (LLMs).
My research focuses on the reliable evaluation of multilingual LLMs, especially the validity of translated benchmarks, translation-aware evaluation, and culturally robust multilingual benchmarking.
</p>

<h3 class="home-section">Experience</h3>
<ul class="home-bullets">
  <li>TU Dresden (ZIH/VDR) — Machine Learning Engineer (NLP/LLMs), since 01/2023</li>
  <li>TU Dresden (ScaDS.AI) — Research Associate (NLP), 02/2020–02/2021</li>
  <li>Fraunhofer IAIS — Data Scientist / Lecturer (Big Data architectures), 01/2017–06/2019</li>
  <li>Fraunhofer IAIS — Software Engineer / Big Data Architect, 07/2013–12/2016</li>
  <li>University of Bonn (EIS) — Research Associate (Semantic Web), 01/2014–11/2015</li>
</ul>

<h3 class="home-section">Research Interests</h3>
<ul class="home-bullets">
  <li>Multilingual LLM evaluation &amp; benchmark design</li>
  <li>Translation artifacts &amp; translation-aware metrics</li>
  <li>Automated benchmark QA (e.g., MT quality estimation, LLM-as-a-judge)</li>
  <li>Human-aligned evaluation / preference validation</li>
  <li>Efficient large-scale evaluation on HPC clusters</li>
</ul>

<p class="home-contact">
<strong>Contact:</strong> klaudia-doris.thellmann <span class="obf">[at]</span> tu-dresden <span class="obf">[dot]</span> de
</p>

<div class="home-links">
  <a href="https://github.com/klaudiath" target="_blank" rel="noopener">GitHub</a>
  <span>·</span>
  <a href="https://www.linkedin.com/in/klaudia-doris-thellmann-b9853a111/" target="_blank" rel="noopener">LinkedIn</a>
  <span>·</span>
  <a href="https://scholar.google.com/citations?view_op=list_works&hl=de&hl=de&user=ljgVUsAAAAAJ" target="_blank" rel="noopener">Google Scholar</a>
  <span>·</span>
  <a href="https://x.com/ThKlaudia" target="_blank" rel="noopener">X</a>
</div>

</div>

<div class="home-right">
<img class="home-avatar" src="/img/avatar.jpg" alt="Portrait" />
</div>

</div>
</div>

<div class="home-news">
  <h3>News</h3>
  <ul class="news-list">
    <li><span class="news-year">2026</span> <em>ACL 2026</em> — Quantifying the impact of translation errors on multilingual LLM evaluation</li>
    <li><span class="news-year">2026</span> <em>LREC 2026</em> — Diagnosing translated benchmarks using automated TQE approaches </li>
    <li><span class="news-year">2025</span> <em>EACL 2025</em> — Teuken-7B-Base &amp; Teuken-7B-Instruct: European LLMs</li>
    <li><span class="news-year">2024</span> <em>EMNLP 2024</em> — Investigating multilingual instruction-tuning</li>
    <li><span class="news-year">2024</span> <em>NAACL 2024</em> — Tokenizer choice for LLM training</li>
  </ul>
</div>
"""


[[menu.main]]
  name = "Publications"
  url = "/publications/"
  weight = 10

[[menu.main]]
  name = "Projects"
  url = "/projects/"
  weight = 20

[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 30

[caches]
  [caches.images]
    dir = ":cacheDir/images"
