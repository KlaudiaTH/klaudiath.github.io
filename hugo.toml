baseURL = "https://klaudiath.github.io/"
languageCode = "en-us"
title = "Klaudia-Doris Thellmann"

theme = "PaperMod"

enableRobotsTXT = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = "production"
  defaultTheme = "auto"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = false

  # Optional: Label links oben (statt Titel)
  [params.label]
    text = "Klaudia-Doris Thellmann"

[params.homeInfoParams]
  Title = "Hello 👋"
  Content = """
<div class="home-grid">
  <div class="home-left">

I am … (1–2 sentences / Position / Uni / Firma).

### Research Interests
- Thema A
- Thema B
- Thema C

**Contact:** vorname.nachname@…

<div class="home-links">
  <a href="https://github.com/klaudiath" target="_blank" rel="noopener">GitHub</a>
  <span>·</span>
  <a href="https://www.linkedin.com/in/…" target="_blank" rel="noopener">LinkedIn</a>
  <span>·</span>
  <a href="https://scholar.google.com/citations?user=…" target="_blank" rel="noopener">Google Scholar</a>
  <span>·</span>
  <a href="https://x.com/DEINHANDLE" target="_blank" rel="noopener">X</a>
</div>

### News
- 04.01.2026: …
- 08.11.2025: …
- 25.10.2025: … (<a href="https://…" target="_blank" rel="noopener">Paper</a>)

  </div>

  <div class="home-right">
    <img class="home-avatar" src="/img/avatar.jpg" alt="Portrait" />
  </div>
</div>
"""

# Menü wie bei der Beispielseite
[[menu.main]]
  name = "Publications"
  url = "/publications/"
  weight = 10

[[menu.main]]
  name = "CV"
  url = "/cv/"
  weight = 20

[caches]
  [caches.images]
    dir = ":cacheDir/images"
