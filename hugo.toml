baseURL = "https://klaudiath.github.io/"
languageCode = "en-us"
title = "Klaudia-Doris Thellmann"

theme = "PaperMod"

enableRobotsTXT = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = "production"
  defaultTheme = "auto"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = false

  # Optional: Label links oben (statt Titel)
  [params.label]
    text = "Klaudia-Doris Thellmann"

[params.homeInfoParams]
  Title = "Hello 👋"
  Content = """
<div class="home-top">
<div class="home-grid">
<div class="home-left">

<p class="home-bio">
I am a Machine Learning Engineer / NLP researcher at TU Dresden, working on multilingual LLM evaluation and scalable benchmarking pipelines.
My background is in computer science (university degree) with a background in data management (Big Data architectures & analytics), now focusing on NLP and large language models (LLMs).
My research focuses on the reliable evaluation of multilingual LLMs, especially the validity of translated benchmarks, translation-aware evaluation, and culturally robust multilingual benchmarking.
</p>

<h3 class="home-section">Research Interests</h3>
<ul class="home-bullets">
  <li>Multilingual LLM evaluation &amp; benchmark design</li>
  <li>Translation artifacts &amp; translation-aware metrics</li>
  <li>Automated benchmark QA (e.g., MT quality estimation, LLM-as-a-judge)</li>
  <li>Human-aligned evaluation / preference validation</li>
  <li>Efficient large-scale evaluation on HPC clusters</li>
</ul>

<p class="home-contact">
<strong>Contact:</strong> klaudia-doris.thellmann <span class="obf">[at]</span> tu-dresden <span class="obf">[dot]</span> de
</p>

<div class="home-links">
  <a href="https://github.com/klaudiath" target="_blank" rel="noopener">GitHub</a>
  <span>·</span>
  <a href="https://www.linkedin.com/in/…" target="_blank" rel="noopener">LinkedIn</a>
  <span>·</span>
  <a href="https://scholar.google.com/citations?user=…" target="_blank" rel="noopener">Google Scholar</a>
  <span>·</span>
  <a href="https://x.com/DEINHANDLE" target="_blank" rel="noopener">X</a>
</div>

</div>

<div class="home-right">
<img class="home-avatar" src="/img/avatar.jpg" alt="Portrait" />
</div>
</div>
</div>

<div class="home-news">
  <h3>News</h3>
  <ul class="news-list">
    <li><span class="news-year">2026</span> <em>Under review</em> — “Diagnosing Translated Benchmarks: An Automated Quality Assurance Study of the EU20 Benchmark Suite.” <span class="news-note">(arXiv forthcoming)</span></li>
    <li><span class="news-year">2026</span> <em>Under review</em> — “Quantifying the Impact of Translation Errors on Multilingual LLM Evaluation.” <span class="news-note">(arXiv forthcoming)</span></li>
    <li><span class="news-year">2025</span> <em>EACL 2025</em> — “Teuken-7B-Base &amp; Teuken-7B-Instruct: Towards European LLMs.”</li>
    <li><span class="news-year">2024</span> <em>EMNLP 2024</em> — “Investigating Multilingual Instruction-Tuning: Do Polyglot Models Demand for Multilingual Instructions?”</li>
    <li><span class="news-year">2024</span> <em>Findings of NAACL 2024</em> — “Tokenizer Choice For LLM Training: Negligible or Crucial?”</li>
  </ul>
</div>
"""


[[menu.main]]
  name = "Publications"
  url = "/publications/"
  weight = 10

[[menu.main]]
  name = "CV"
  url = "/cv/"
  weight = 20

[caches]
  [caches.images]
    dir = ":cacheDir/images"
