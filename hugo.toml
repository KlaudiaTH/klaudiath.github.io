baseURL = "https://klaudiath.github.io/"
languageCode = "en-us"
title = "Klaudia-Doris Thellmann"

theme = "PaperMod"

enableRobotsTXT = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = "production"
  defaultTheme = "auto"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = false

  # Optional: Label links oben (statt Titel)
  [params.label]
    text = "Klaudia-Doris Thellmann"

[params.homeInfoParams]
  Title = "Hello 👋"
  Content = """
<div class="home-grid">
  <div class="home-left">

I am a Machine Learning Engineer / NLP researcher at **TU Dresden (CIDS / ZIH)**, working on **multilingual LLM evaluation** and **scalable benchmarking pipelines**. My research focuses on the reliability of translated benchmarks, translation-aware evaluation, and methods for culturally robust multilingual benchmarking.

### Research Interests
- Multilingual LLM evaluation & benchmark design
- Translation artifacts & translation-aware metrics
- Automated benchmark QA (e.g., MT quality estimation, LLM-as-a-judge)
- Human-aligned evaluation / preference validation
- Efficient large-scale evaluation on HPC clusters

**Contact:** klaudia-doris.thellmann@tu-dresden.de

<div class="home-links">
  <a href="https://github.com/klaudiath" target="_blank" rel="noopener">GitHub</a>
  <span>·</span>
  <a href="https://www.linkedin.com/in/klaudia-doris-thellmann" target="_blank" rel="noopener">LinkedIn</a>
  <span>·</span>
  <a href="https://scholar.google.com/citations?user=ljgVUsAAAAAJ" target="_blank" rel="noopener">Google Scholar</a>
  <span>·</span>
  <a href="https://x.com/DEINHANDLE" target="_blank" rel="noopener">X</a>
</div>

### News
- **2026:** *Under review* — “Diagnosing Translated Benchmarks: An Automated Quality Assurance Study of the EU20 Benchmark Suite.” *(arXiv forthcoming)*
- **2026:** *Under review* — “Quantifying the Impact of Translation Errors on Multilingual LLM Evaluation.” *(arXiv forthcoming)*
- **2025:** *EACL 2025* — “Teuken-7B-Base & Teuken-7B-Instruct: Towards European LLMs.”
- **2024:** *EMNLP 2024* — “Investigating Multilingual Instruction-Tuning: Do Polyglot Models Demand for Multilingual Instructions?”
- **2024:** *NAACL 2024 Findings* — “Tokenizer Choice For LLM Training: Negligible or Crucial?”

  </div>

  <div class="home-right">
    <img class="home-avatar" src="/img/avatar.jpg" alt="Portrait" />
  </div>
</div>
"""

# Menü wie bei der Beispielseite
[[menu.main]]
  name = "Publications"
  url = "/publications/"
  weight = 10

[[menu.main]]
  name = "CV"
  url = "/cv/"
  weight = 20

